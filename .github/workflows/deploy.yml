# Builds the game and publishes dist/ to GitHub Pages on every push to main (CLAUDE.md §10).
# Not yet included: Firebase config (VITE_FIREBASE_* secrets) and App Check — Phases 5/6.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run from the Actions tab

# One Pages deployment at a time; a newer push waits instead of cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege by default; only the deploy job gets Pages rights.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (typecheck + vite build)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # prove the deployment comes from this workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
